# Server Configuration
server.port=${PORT:8083}

# In-Memory / File-based H2 Database for Render Free Tier or Environments without MySQL
spring.datasource.url=jdbc:h2:file:./data/smartfamily;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT Security
app.jwt.secret=SmartFamilyFinancialSecretKeyMustBeVeryLongAndSecureFor256BitsMinimum
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.smartfamily.financial=INFO
logging.level.org.springframework.security=WARN
