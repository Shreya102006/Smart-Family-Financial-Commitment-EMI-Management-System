# Server Configuration (Supports Render/Cloud PORT environment variable, defaults to 8083)
server.port=${PORT:8083}

# Database Configuration (MySQL / Cloud Database)
# Supports SPRING_DATASOURCE_URL, DATABASE_URL, or DB_HOST/DB_PORT/DB_NAME environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_family_financial_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# JWT Security
app.jwt.secret=SmartFamilyFinancialSecretKeyMustBeVeryLongAndSecureFor256BitsMinimum
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.smartfamily.financial=INFO
logging.level.org.springframework.security=WARN
